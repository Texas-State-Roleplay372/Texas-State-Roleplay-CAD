<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Texas CAD – Computer Aided Dispatch</title>
<style>
:root{--bg:#0b1118;--card:#121b26;--tx:#dbe4ee;--mu:#7f90a3;--bd:#233142;--ac:#2f81f7;--p1:#c62828;--p2:#e67e22;--p3:#2e7d32;--p4:#607d8b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141b;--card:#18212b;--tx:#e6ebf1;--mu:#93a1b1;--bd:#2b3846;--ac:#5b9bff}}
:root[data-theme="dark"]{--bg:#0e141b;--card:#18212b;--tx:#e6ebf1;--mu:#93a1b1;--bd:#2b3846;--ac:#5b9bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Segoe UI,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
header b{font-size:16px}.sp{flex:1}
nav{display:flex;gap:4px;overflow-x:auto;padding:6px 12px}nav button{white-space:nowrap}
main{padding:0 12px 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;min-width:0}.wide{grid-column:1/-1}
h3{margin:0 0 8px;font-size:14px}.form{display:grid;gap:6px}label{display:grid;gap:2px;font-size:12px;color:var(--mu)}
input,select,textarea{font:inherit;padding:6px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--tx);width:100%}textarea{min-height:50px}
button{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:5px;background:var(--card);color:var(--tx);cursor:pointer}
button.pri,button.on{background:var(--ac);color:#fff;border-color:var(--ac)}button.red{background:var(--p1);color:#fff;border-color:var(--p1)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--bd);vertical-align:top;font-size:13px}th{color:var(--mu);font-weight:600;white-space:nowrap}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;color:#fff;font-size:12px;font-weight:600}.p1{background:var(--p1)}.p2{background:var(--p2)}.p3{background:var(--p3)}.p4{background:var(--p4)}
.alert{margin:8px 12px;padding:8px 12px;border-radius:6px;background:var(--p1);color:#fff;display:flex;gap:8px;align-items:center}.alert.i{background:var(--p2)}
.bar{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}.mu{color:var(--mu)}.login{max-width:360px;margin:60px auto}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:6px;display:none}
table{font-family:ui-monospace,Consolas,monospace}th{text-transform:uppercase;font-size:11px;letter-spacing:.05em;background:rgba(127,144,163,.08)}tr:hover td{background:rgba(47,129,247,.07)}header{background:linear-gradient(#16263a,#0f1a28);border-bottom:2px solid var(--ac);color:#fff}header .mu{color:#9fb3c8}header button{background:#1b2d42;border-color:#2a4560;color:#fff}header button.pri{background:var(--ac)}header button.red{background:var(--p1)}.clk{font-family:ui-monospace,Consolas,monospace;color:#7fd3ff;padding:2px 8px;border:1px solid #2a4560;border-radius:4px;background:#0a121b}.card{box-shadow:0 2px 8px rgba(0,0,0,.35)}h3{text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--mu);border-bottom:1px solid var(--bd);padding-bottom:6px}nav{background:#0f1a28;border-bottom:1px solid var(--bd)}nav button{border-radius:0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--mu)}nav button.on{border-bottom-color:var(--ac);color:#fff;background:rgba(47,129,247,.15)}
body{background:radial-gradient(1200px 500px at 50% -100px,#13263c,#0b1118) fixed}.strip{display:flex;gap:2px;margin:0 12px 6px;font-family:ui-monospace,Consolas,monospace;font-size:12px}.strip span{flex:1;padding:5px 10px;background:#0a121b;border:1px solid var(--bd);color:var(--mu);text-align:center}.strip b{color:#7fd3ff;font-size:15px;margin-left:6px}.strip .hot{background:#4a1212;border-color:var(--p1);color:#ffb4b4;animation:bl 1s infinite}.strip .hot b{color:#fff}@keyframes bl{50%{opacity:.6}}.alert{animation:bl 1.2s infinite;border:1px solid #ff8a80;text-transform:uppercase;font-weight:600}.tag{border-radius:3px;font-family:ui-monospace,Consolas,monospace}input,select,textarea{background:#0a121b}
.mapsvg{touch-action:none;width:100%;height:auto;display:block;border:1px solid var(--bd);border-radius:6px;cursor:crosshair;background:#0a121b}
.lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,42%);gap:12px;padding:0 12px 24px;align-items:start}.lay.one{grid-template-columns:1fr}.lay main{padding:0;min-width:0}.side{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}.sidebtn{margin-left:auto}@media(max-width:700px){.lay{grid-template-columns:1fr}.side{position:static;order:-1}}
body{font:13px/1.35 "Segoe UI",Roboto,Arial,sans-serif}*{scrollbar-color:#2a4560 #0a121b}.card,button,input,select,textarea,.alert{border-radius:2px}
.card{padding:0;overflow:hidden;border-color:#2a4560}.card>h3{margin:0;padding:7px 10px;background:linear-gradient(#1f3249,#142235);border-bottom:1px solid #2a4560;color:#c9dcf0}.card>*:not(h3){margin:10px}.card>.sc{margin:0}
th{background:#0f1c2b;color:#8fb0d0;border-bottom:2px solid #2a4560;padding:5px 8px}td{padding:4px 8px}tr:nth-child(even) td{background:rgba(255,255,255,.025)}
tr.rp1 td{background:rgba(198,40,40,.18)}tr.rp2 td{background:rgba(230,126,34,.12)}tr.rp1 td:first-child{border-left:4px solid var(--p1)}tr.rp2 td:first-child{border-left:4px solid var(--p2)}tr.rp3 td:first-child{border-left:4px solid var(--p3)}tr.rp4 td:first-child{border-left:4px solid var(--p4)}
button{background:linear-gradient(#22364d,#182a3e);border:1px solid #2f4b69;color:#dbe4ee}button:hover{filter:brightness(1.25)}
.brand{letter-spacing:.08em;text-transform:uppercase;border-left:4px solid var(--ac);padding-left:8px}.pill{padding:1px 9px;border-radius:2px;background:#4a5a6a;color:#fff;text-transform:uppercase;font-size:11px;letter-spacing:.05em}.pill.on{background:#2e7d32}.pill.break{background:#c77d00}
body{padding-bottom:30px}.cg>.card:first-child{order:2}
.shell{display:grid;grid-template-columns:172px minmax(0,1fr);align-items:start}.shell>nav{flex-direction:column;gap:0;overflow:visible;padding:6px 0;background:#0c1622;border-right:1px solid var(--bd);min-height:calc(100vh - 120px)}.shell>nav button{display:flex;gap:9px;align-items:center;text-align:left;padding:9px 10px;border:0;border-left:3px solid transparent;background:transparent;color:#a9bbcf}.shell>nav button.on{border-left-color:var(--ac);background:rgba(47,129,247,.16);color:#fff}.shell>nav button:hover{background:rgba(47,129,247,.1)}nav i{font:700 10px ui-monospace,Consolas,monospace;font-style:normal;width:28px;padding:3px 0;text-align:center;background:#16263a;border:1px solid #2a4560;color:#7fd3ff}.sidebtn{margin-top:auto;margin-left:0!important}.lay{padding-top:10px}
tr.u108 td:first-child{border-left:4px solid #2e9e4f}tr.u106 td:first-child{border-left:4px solid #e0a000}tr.u107 td:first-child{border-left:4px solid #7a8b99}tr.u1023 td:first-child{border-left:4px solid #2f81f7}tr.u1076 td:first-child{border-left:4px solid #a56bff}tr.u1099 td{background:rgba(198,40,40,.22)}tr.u1099 td:first-child{border-left:4px solid #ff3b30}tr.uOff td{opacity:.55}
.foot{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;gap:18px;padding:4px 12px;background:#0a121b;border-top:1px solid #2a4560;font:11px ui-monospace,Consolas,monospace;color:#7f90a3;text-transform:uppercase;letter-spacing:.05em}
@media(max-width:700px){.shell{grid-template-columns:1fr}.shell>nav{flex-direction:row;overflow-x:auto;min-height:0}}
</style></head><body><div id="app"></div><div id="toast"></div>

function can(t){const m=me(),d=S.depts.find(x=>x.id===m.dept);return (t==='map'?m.role!=='Civilian':S.roles[m.role].includes(t))&&(m.role==='Admin'||!d||t==='map'||d.perms.includes(t))}
const isSup=()=>['Supervisor','Admin'].includes(me().role);
function inp(i,l,o){if(Array.isArray(o))return`<label>${l}<select id="f_${i}">${o.map(x=>`<option>${e(x)}</option>`).join('')}</select></label>`;if(o==='ta')return`<label>${l}<textarea id="f_${i}"></textarea></label>`;return`<label>${l}<input id="f_${i}" type="${o||'text'}"></label>`}
const FM={};
function form(id,spec,btn,cb){FM[id]={spec,cb};return`<div class="form">${spec.map(s=>inp(id+'_'+s[0],s[1],s[2])).join('')}<button class="pri" onclick="go('${id}')">${btn}</button></div>`}
function go(id){const f=FM[id],v={};for(const s of f.spec){v[s[0]]=document.getElementById('f_'+id+'_'+s[0]).value;if(s[3]==='r'&&!v[s[0]].trim())return toast(s[1]+' is required')}f.cb(v);save();render()}
const callno=i=>'26-'+String(i).replace(/\D/g,'').padStart(6,'0');
const tbl=(cols,rows,rc)=>`<div class="sc"><table><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr>${rows.map(r=>`<tr class="${rc?rc(r):''}">${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')||`<tr><td class="mu" colspan="${cols.length}">No records</td></tr>`}</table></div>`;
const sel=(opts,cur,fn)=>`<select onchange="${fn}">${opts.map(o=>`<option${o===cur?' selected':''}>${e(o)}</option>`).join('')}</select>`;
const card=(t,b,w)=>`<div class="card${w?' wide':''}"><h3>${t}</h3>${b}</div>`;
const tag=p=>`<span class="tag p${p}">P${p}</span>`;
/* ---------- shift ---------- */
function shift(a){const m=me(),u=myU();
if(a==='start'){m.sh='on';m.start=iso();if(u)u.status=ST[0];log('Started shift')}
if(a==='break'){m.sh='break';if(u)u.status=ST[2];log('Started break')}
if(a==='resume'){m.sh='on';if(u)u.status=ST[0];log('Ended break')}
if(a==='end'){m.sh='off';if(u)u.status=ST[6];log('Ended shift')}
save();render()}
function panic(){const u=myU();if(u)u.status=ST[5];S.alerts.unshift({id:id_('A'),t:iso(),lvl:1,on:true,text:`PANIC – ${u?u.callsign:me().name} needs immediate assistance at ${u?u.loc:'unknown'}`});log('PANIC BUTTON');save();render()}
function login(id){S.meId=id;S.logins.unshift({t:iso(),u:unit?S.users.find(x=>x.id===id).name:'',a:'Login'});log('Logged in');render()}
function logout(){log('Logged out');S.meId=null;save();render()}
/* ---------- tabs ---------- */
function calls(){const rows=S.calls.filter(c=>CF==='All'||c.status===CF).sort((a,b)=>b.t.localeCompare(a.t));const dis=S.users.filter(u=>['Dispatcher','Supervisor','Admin'].includes(u.role)).map(u=>u.name);
return`<div class="grid cg">${card('New call for service',form('call',[['type','Call type',S.set.types],['pri','Priority (1 = highest)',['1','2','3','4']],['name','Caller name','text'],['phone','Caller phone','tel'],['loc','Incident location','text','r'],['dept','Route to',S.depts.map(d=>d.id)],['notes','Call notes','ta']],'Create call',v=>{S.calls.push({id:id_('C'),t:iso(),type:v.type,pri:+v.pri,name:v.name,phone:v.phone,loc:v.loc,dept:v.dept,notes:[v.notes?`${fmt(iso())} ${me().name}: ${v.notes}`:''].filter(Boolean),disp:'',units:[],status:'Pending',closed:null});log('Created call '+v.type+' @ '+v.loc)}))}
${card('Calls for service',`<div class="bar">${['All','Pending','Active','Closed'].map(f=>`<button class="${CF===f?'on':''}" onclick="CF='${f}';render()">${f} (${S.calls.filter(c=>f==='All'||c.status===f).length})</button>`).join('')}</div>`+tbl([['CFS #',c=>'<b>'+callno(c.id)+'</b>'],['Time',c=>fmt(c.t)],['Pri',c=>tag(c.pri)],['Type',c=>e(c.type)],['Location',c=>e(c.loc)],['Caller',c=>e(c.name)+'<br><span class="mu">'+e(c.phone)+'</span>'],['Dispatcher',c=>sel(['—',...dis],c.disp||'—',`setC('${c.id}','disp',this.value)`)],['Units',c=>c.units.map(cs).join(', ')+'<br>'+sel(['+ assign',...S.units.filter(u=>u.status!==ST[6]).map(u=>u.callsign)],'+ assign',`asg('${c.id}',this.value)`)],['Notes',c=>c.notes.map(e).join('<br>')+`<br><button onclick="note('${c.id}')">+ note</button>`],['Status',c=>sel(['Pending','Active','Closed'],c.status,`setC('${c.id}','status',this.value)`)+(c.closed?'<br><span class="mu">'+fmt(c.closed)+'</span>':'')]],rows,c=>'rp'+c.pri),1)}</div>`}
function setC(id,k,v){const c=S.calls.find(x=>x.id===id);c[k]=v==='—'?'':v;if(k==='status'){c.closed=v==='Closed'?iso():null;if(v==='Closed')c.units.forEach(i=>{const u=unit(i);if(u&&u.status!==ST[6])u.status=ST[0]})}log(`Call ${id} ${k} → ${v}`);save();render()}
function asg(id,cl){if(cl==='+ assign')return;const c=S.calls.find(x=>x.id===id),u=S.units.find(x=>x.callsign===cl);if(!c.units.includes(u.id)){c.units.push(u.id);u.status=ST[4];if(c.status==='Pending')c.status='Active';log(`Assigned ${cl} to ${id}`)}save();render()}
function note(id){const t=prompt('Call note');if(!t)return;S.calls.find(x=>x.id===id).notes.push(`${fmt(iso())} ${me().name}: ${t}`);log('Note on '+id);save();render()}
function units(){const rows=S.units.filter(u=>isSup()||me().role==='Dispatcher'||u.dept===me().dept);
return`<div class="grid">${card('Officer roster',tbl([['Name',u=>e(u.name)],['Callsign',u=>`<b>${e(u.callsign)}</b>`],['Badge',u=>e(u.badge)],['Rank',u=>e(u.rank)],['Dept',u=>e(u.dept)],['Status',u=>stc(u.status)+sel(ST,u.status,`setU('${u.id}','status',this.value)`)],['Vehicle',u=>e(u.vehicle)],['Location',u=>e(u.loc)+` <button onclick="locU('${u.id}')">✎</button>`],['Supervisor',u=>e(u.sup)]],rows,u=>'u'+u.status.split(' ')[0].replace('-','')),1)}
${isSup()?card('Add officer / unit',form('unit',[['name','Name','text','r'],['callsign','Callsign','text','r'],['badge','Badge #','text'],['rank','Rank',S.set.ranks],['dept','Department',S.depts.map(d=>d.id)],['vehicle','Assigned vehicle','text'],['sup','Supervisor','text']],'Add',v=>{S.units.push({id:id_('u'),...v,status:ST[6],loc:'—'});log('Added unit '+v.callsign)})):''}</div>`}
function setU(id,k,v){unit(id)[k]=v;log(`${cs(id)} ${k} → ${v}`);save();render()}
function locU(id){const v=prompt('Current location');if(v)setU(id,'loc',v)}
function depts(){return`<div class="grid">${S.depts.map(d=>{const us=S.units.filter(u=>u.dept===d.id);return card(`${e(d.name)} <span class="mu">(${d.id})</span>`,`<p><b>Command staff:</b><br>${S.users.filter(u=>u.dept===d.id&&CMDR.includes(u.rank)).map(u=>e(u.rank+' '+u.name)).join('<br>')||'—'}</p>${d.struct?d.struct.map(g=>`<p><b>${g[0]}:</b> ${g[1].join(' · ')}</p>`).join(''):''}<p><b>Callsign prefix:</b> ${e(d.prefix)}-</p><p><b>Permissions:</b> ${d.perms.join(', ')}</p><p><b>Roster:</b> ${us.map(u=>e(u.callsign)+' '+e(u.name)).join('; ')||'—'}</p><p><b>Dept report:</b> ${S.calls.filter(c=>c.dept===d.id).length} calls · ${S.arrests.filter(a=>a.dept===d.id).length} arrests · ${S.cites.filter(a=>a.dept===d.id).length} citations · ${us.filter(u=>u.status!==ST[6]).length}/${us.length} units on duty</p>`)}).join('')}</div>`}
function look(q){q=q.toLowerCase();const ps=S.people.filter(p=>(p.name+p.dl).toLowerCase().includes(q)),vs=S.vehs.filter(v=>(v.plate+v.owner+v.desc).toLowerCase().includes(q));let h='';
ps.forEach(p=>{h+=`<div class="card"><b>${e(p.name)}</b> · DOB ${e(p.dob)}<br>DL ${e(p.dl)} – <b>${e(p.dls)}</b><br>${e(p.addr)}<br>Warrants: ${S.warrants.filter(w=>w.name===p.name&&w.status==='Active').map(w=>`<span class="tag p1">${e(w.charge)}</span>`).join(' ')||'none'}<br>Citations: ${S.cites.filter(c=>c.name===p.name).length} · Arrests: ${S.arrests.filter(c=>c.name===p.name).length}</div>`});
vs.forEach(v=>{h+=`<div class="card"><b>${e(v.plate)}</b> ${e(v.color)} ${e(v.desc)}<br>Owner: ${e(v.owner)}<br>Registration: <b>${e(v.reg)}</b> (exp ${e(v.exp)})${v.stolen?' <span class="tag p1">STOLEN</span>':''}<br>BOLO: ${S.bolos.some(b=>b.status==='Active'&&b.desc.includes(v.plate))?'<span class="tag p1">ACTIVE</span>':'none'}</div>`});
return h||'<p class="mu">No match.</p>'}
function records(){const V=['Search','Warrants','Citations','Arrests','BOLOs','Missing Persons'];let b='';
if(RS==='Search')b=`<div class="form"><input id="q" placeholder="Name, DL #, plate…" value="${e(Q)}" onkeydown="if(event.key==='Enter'){Q=this.value;render()}"><button class="pri" onclick="Q=document.getElementById('q').value;render()">Lookup</button></div><div class="grid" style="margin-top:8px">${Q?look(Q):''}</div><hr>`+card('Add person',form('per',[['name','Full name','text','r'],['dob','DOB','date'],['dl','DL #','text'],['dls','License status',['Valid','Expired','Suspended','Revoked','None']],['addr','Address','text']],'Save',v=>{S.people.push(v);log('Added person '+v.name)}))+card('Add vehicle',form('veh',[['plate','Plate','text','r'],['desc','Year / make / model','text'],['color','Color','text'],['owner','Registered owner','text'],['reg','Registration',['Valid','Expired','Suspended']],['exp','Reg. expires','date']],'Save',v=>{S.vehs.push({...v,plate:v.plate.toUpperCase(),stolen:false});log('Added vehicle '+v.plate)}));
if(RS==='Warrants')b=tbl([['ID',w=>w.id],['Name',w=>e(w.name)],['Charge',w=>e(w.charge)],['Issued',w=>e(w.issued)],['Status',w=>sel(['Active','Served','Recalled'],w.status,`wst('${w.id}',this.value)`)]],S.warrants)+form('war',[['name','Name','text','r'],['charge','Charge','text','r'],['issued','Issued','date']],'Add warrant',v=>{S.warrants.push({id:id_('W'),...v,status:'Active'});log('Warrant for '+v.name)});
if(RS==='Citations')b=tbl([['No.',c=>c.id],['Name',c=>e(c.name)],['Violation',c=>e(c.viol)],['Fine',c=>'$'+e(c.fine)],['Court',c=>e(c.court)],['Date',c=>fmt(c.t)]],S.cites);
if(RS==='Arrests')b=tbl([['No.',c=>c.id],['Suspect',c=>e(c.name)],['Charges',c=>e(c.charges)],['Officer',c=>e(c.officer)],['Date',c=>fmt(c.t)]],S.arrests);
if(RS==='BOLOs')b=tbl([['ID',x=>x.id],['Type',x=>x.kind],['Details',x=>e(x.desc)],['Posted',x=>fmt(x.t)+' by '+e(x.by)],['Status',x=>isSup()?sel(['Active','Cancelled'],x.status,`bst('${x.id}',this.value)`):x.status]],S.bolos)+form('bolo',[['kind','Type',['Vehicle','Person','Other']],['desc','Description','ta','r']],'Post BOLO',v=>{S.bolos.unshift({id:id_('B'),t:iso(),...v,by:me().name,status:'Active'});S.alerts.unshift({id:id_('A'),t:iso(),lvl:2,on:true,text:'BOLO: '+v.desc});log('BOLO posted')});
if(RS==='Missing Persons')b=tbl([['ID',x=>x.id],['Name',x=>e(x.name)],['Age',x=>e(x.age)],['Description',x=>e(x.desc)],['Last seen',x=>e(x.last)],['Status',x=>sel(['Active','Located'],x.status,`mst('${x.id}',this.value)`)]],S.missing)+form('mis',[['name','Name','text','r'],['age','Age','text'],['desc','Description','ta'],['last','Last seen','text']],'Add report',v=>{S.missing.push({id:id_('M'),...v,status:'Active'});log('Missing person '+v.name)});
return`<div class="bar">${V.map(v=>`<button class="${RS===v?'on':''}" onclick="RS='${v}';render()">${v}</button>`).join('')}</div>${b}`}
function wst(i,v){S.warrants.find(x=>x.id===i).status=v;log('Warrant '+i+' '+v);save();render()}
function bst(i,v){S.bolos.find(x=>x.id===i).status=v;log('BOLO '+i+' '+v);save();render()}
function mst(i,v){S.missing.find(x=>x.id===i).status=v;log('Missing '+i+' '+v);save();render()}
function stop(){const rows=[...S.stops].reverse();
return`<div class="grid">${card('Plate lookup',`<div class="form"><input id="pl" placeholder="Plate e.g. LKR-4821"><button onclick="plate()">Lookup &amp; fill form</button></div><div id="plr"></div>`)}
${card('New traffic stop',form('ts',[['plate','License plate','text','r'],['veh','Vehicle (year/make/model/color)','text'],['driver','Driver name','text','r'],['dl','Driver license #','text'],['loc','Stop location','text','r'],['reason','Reason for stop','text','r'],['backup','Backup requested',['No','Yes']],['out','Result',['Warning','Citation','Arrest','No action']],['fine','Fine amount ($, if citation)','number'],['notes','Stop notes','ta']],'Log stop',v=>{const u=myU();S.stops.push({id:id_('TS'),t:iso(),...v,officer:u?u.callsign:me().name});if(u){u.status=ST[3];u.loc=v.loc}
if(v.backup==='Yes')S.alerts.unshift({id:id_('A'),t:iso(),lvl:2,on:true,text:`BACKUP REQUESTED – ${u?u.callsign:me().name} traffic stop at ${v.loc} (${v.plate})`});
if(v.out==='Citation')S.cites.push({id:id_('CT'),t:iso(),name:v.driver,viol:v.reason,loc:v.loc,fine:v.fine||'0',court:new Date(Date.now()+30*864e5).toLocaleDateString(),officer:u?u.callsign:me().name,dept:me().dept,status:'Pending'});log('Traffic stop '+v.plate+' → '+v.out)}))}
${card('Stop log',tbl([['Time',s=>fmt(s.t)],['Unit',s=>e(s.officer)],['Plate',s=>e(s.plate)],['Driver',s=>e(s.driver)],['Location',s=>e(s.loc)],['Reason',s=>e(s.reason)],['Result',s=>e(s.out)],['Backup',s=>s.backup]],rows),1)}</div>`}
function plate(){const p=document.getElementById('pl').value.trim().toUpperCase();document.getElementById('plr').innerHTML=look(p||'~~');const v=S.vehs.find(x=>x.plate===p);if(v){const o=S.people.find(x=>x.name===v.owner);const s=(k,x)=>document.getElementById('f_ts_'+k).value=x;s('plate',v.plate);s('veh',`${v.desc} ${v.color}`);s('driver',v.owner);if(o)s('dl',o.dl)}}
function reports(){const ap=(t,r)=>isSup()?sel(['Pending','Approved','Rejected'],r.status,`rst('${t}','${r.id}',this.value)`):r.status,vis=r=>isSup()||r.dept===me().dept;
return`<div class="grid">${card('Arrest report',form('ar',[['name','Suspect name','text','r'],['dob','Suspect DOB','date'],['charges','Charges','text','r'],['loc','Arrest location','text'],['evid','Evidence','ta'],['book','Booking facility / #','text'],['narr','Narrative','ta']],'Submit arrest report',v=>{const u=myU();S.arrests.push({id:id_('AR'),t:iso(),...v,officer:u?u.callsign+' '+me().name:me().name,dept:me().dept,status:'Pending'});log('Arrest report '+v.name)}))}
${card('Citation',form('ci',[['name','Violator name','text','r'],['viol','Violation','text','r'],['loc','Location','text'],['fine','Fine amount ($)','number'],['court','Court date','date']],'Issue citation',v=>{const u=myU();S.cites.push({id:id_('CT'),t:iso(),...v,officer:u?u.callsign:me().name,dept:me().dept,status:'Pending'});log('Citation '+v.name)}))}
${card('Arrest reports',tbl([['No.',r=>r.id],['Suspect',r=>e(r.name)+'<br><span class="mu">'+e(r.dob)+'</span>'],['Charges',r=>e(r.charges)],['Location',r=>e(r.loc)],['Evidence',r=>e(r.evid)],['Booking',r=>e(r.book)],['Officer',r=>e(r.officer)],['Approval',r=>ap('arrests',r)]],S.arrests.filter(vis)),1)}
${card('Citations',tbl([['No.',r=>r.id],['Name',r=>e(r.name)],['Violation',r=>e(r.viol)],['Fine',r=>'$'+e(r.fine)],['Court date',r=>e(r.court)],['Officer',r=>e(r.officer)],['Approval',r=>ap('cites',r)]],S.cites.filter(vis)),1)}</div>`}
function rst(t,i,v){S[t].find(x=>x.id===i).status=v;log(`${i} ${v}`);save();render()}
function fireems(){const K=['Medical','Fire','Rescue'],EST=['Dispatched','En Route','On Scene','Transporting','At Hospital','Cleared'];
return`<div class="grid">${card('New Fire / EMS incident',form('em',[['kind','Incident type',K],['loc','Location','text','r'],['pt','Patient name','text'],['age','Patient age','text'],['comp','Complaint / details','ta'],['app','Units / apparatus (e.g. E-12, M-5)','text'],['dest','Transport destination','text']],'Dispatch',v=>{S.ems.push({id:id_('FE'),t:iso(),...v,status:'Dispatched'});S.calls.push({id:id_('C'),t:iso(),type:v.kind==='Fire'?'Structure Fire':v.kind==='Rescue'?'Rescue':'Medical Emergency',pri:1,name:'',phone:'',loc:v.loc,dept:'HFD',disp:me().name,units:[],notes:[v.comp],status:'Active',closed:null});log(v.kind+' incident at '+v.loc)}))}
${card('Incidents',tbl([['ID',x=>x.id],['Time',x=>fmt(x.t)],['Type',x=>x.kind],['Location',x=>e(x.loc)],['Patient',x=>e(x.pt)+' '+e(x.age)],['Details',x=>e(x.comp)],['Units',x=>e(x.app)],['Destination',x=>e(x.dest)],['Status',x=>sel(EST,x.status,`rst('ems','${x.id}',this.value)`)]],S.ems),1)}
${card('Fire & EMS units',tbl([['Unit',u=>e(u.callsign)],['Name',u=>e(u.name)],['Dept',u=>u.dept],['Status',u=>sel(ST,u.status,`setU('${u.id}','status',this.value)`)]],S.units.filter(u=>u.dept==='HFD')),1)}</div>`}
function sup(){const a=S.calls.filter(c=>c.status!=='Closed').length,pend=[...S.arrests,...S.cites].filter(r=>r.status==='Pending').length;
return`<div class="grid">${card('Statistics',`<p>Active/pending calls: <b>${a}</b> · Total calls: <b>${S.calls.length}</b> · Units on duty: <b>${S.units.filter(u=>u.status!==ST[6]).length}/${S.units.length}</b> · Reports awaiting approval: <b>${pend}</b> · Stops: <b>${S.stops.length}</b></p>`+tbl([['Dept',d=>d.id],['Calls',d=>S.calls.filter(c=>c.dept===d.id).length],['Arrests',d=>S.arrests.filter(c=>c.dept===d.id).length],['Citations',d=>S.cites.filter(c=>c.dept===d.id).length],['On duty',d=>S.units.filter(u=>u.dept===d.id&&u.status!==ST[6]).length]],S.depts))}
${card('Issue alert',form('al',[['lvl','Level',['1 – Emergency','2 – Advisory']],['text','Alert text','ta','r']],'Broadcast',v=>{S.alerts.unshift({id:id_('A'),t:iso(),lvl:+v.lvl[0],on:true,text:v.text});log('Alert issued')}))}
${card('Live unit monitor',tbl([['Unit',u=>e(u.callsign)],['Name',u=>e(u.name)],['Status',u=>e(u.status)],['Location',u=>e(u.loc)],['Call',u=>S.calls.filter(c=>c.status!=='Closed'&&c.units.includes(u.id)).map(c=>c.id).join(', ')||'—']],S.units),1)}
${card('Officer activity log',tbl([['Time',a=>fmt(a.t)],['User',a=>e(a.u)],['Activity',a=>e(a.a)]],S.audit.slice(0,25)),1)}
${card('Manage active calls &amp; BOLOs',`<p>${S.calls.filter(c=>c.status!=='Closed').map(c=>`${c.id} ${e(c.type)} (${e(c.loc)})`).join('<br>')||'No open calls'}</p><p class="mu">Close or reassign on the Calls tab · manage BOLOs and approve reports in Records / Reports.</p>`)}</div>`}
function comms(){const u=myU();
return`<div class="grid">${card('Radio channels',tbl([['Channel',c=>e(c.n)],['Status',c=>c.on?'🟢 Active':'⚫ Inactive'],['',c=>`<button onclick="chan('${e(c.n)}')">${c.on?'Close':'Open'}</button>`]],S.chans)+(isSup()?form('ch',[['n','New channel','text','r']],'Add',v=>{S.chans.push({n:v.n,on:true})}):''))}
${card('Send message',form('ms',[['kind','Type',['Dispatch announcement','Unit-to-unit','Supervisor notification','Emergency alert']],['to','To (callsign or ALL)','text'],['text','Message','ta','r']],'Send',v=>{S.msgs.unshift({t:iso(),from:u?u.callsign:me().name,to:v.to||'ALL',kind:v.kind,text:v.text});if(v.kind==='Emergency alert')S.alerts.unshift({id:id_('A'),t:iso(),lvl:1,on:true,text:v.text});log(v.kind)}))}
${card('Panic',`<button class="red" onclick="if(confirm('Send panic alert?'))panic()">🚨 PANIC / 10-99</button>`)}
${card('Message feed',tbl([['Time',m=>fmt(m.t)],['Type',m=>m.kind],['From → To',m=>e(m.from)+' → '+e(m.to)],['Message',m=>e(m.text)]],S.msgs.slice(0,40)),1)}</div>`}
function chan(n){const c=S.chans.find(x=>x.n===n);c.on=!c.on;save();render()}
function admin(){return`<div class="grid">${card('User accounts',tbl([['Name',u=>e(u.name)],['Role',u=>sel(Object.keys(S.roles),u.role,`usr('${u.id}','role',this.value)`)],['Dept',u=>sel(S.depts.map(d=>d.id),u.dept,`usr('${u.id}','dept',this.value)`)],['Unit',u=>e(u.uid?cs(u.uid):'—')]],S.users)+form('us',[['name','Name','text','r'],['role','Role',Object.keys(S.roles)],['dept','Dept',S.depts.map(d=>d.id)],['uid','Linked unit callsign','text']],'Create account',v=>{const un=S.units.find(x=>x.callsign===v.uid);S.users.push({id:id_('x'),name:v.name,role:v.role,dept:v.dept,uid:un?un.id:null,sh:'off'});log('Account '+v.name)}),1)}
${card('Role permissions',tbl([['Role',r=>r],...TABS.map(t=>[t[1],r=>`<input type="checkbox" ${S.roles[r].includes(t[0])?'checked':''} onchange="perm('${r}','${t[0]}',this.checked)">`])],Object.keys(S.roles)),1)}
${card('Department configuration',form('dp',[['id','Dept ID','text','r'],['name','Name','text','r'],['prefix','Callsign prefix','text'],['cmd','Command staff (comma separated)','text']],'Add department',v=>{S.depts.push({id:v.id.toUpperCase(),name:v.name,prefix:v.prefix,cmd:v.cmd.split(',').map(s=>s.trim()).filter(Boolean),perms:['calls','units','depts','records','reports','comms']});log('Dept '+v.id)}))}
${card('Ranks &amp; call types',`<p>Ranks: ${S.set.ranks.map(e).join(', ')}</p>`+form('rk',[['r','New rank','text'],['t','New call type','text']],'Add',v=>{if(v.r)S.set.ranks.push(v.r);if(v.t)S.set.types.push(v.t);log('Config updated')})+`<p class="mu">Callsigns: edit in Officers (add unit) · prefixes in Departments.</p>`)}
${card('System settings',form('sy',[['agency','Agency / system name','text']],'Save',v=>{if(v.agency)S.set.agency=v.agency;log('Settings changed')})+`<p><button class="red" onclick="if(confirm('Reset ALL data?')){S=blank();save();render()}">Reset all data</button></p>`)}
${card('Audit log',tbl([['Time',a=>fmt(a.t)],['User',a=>e(a.u)],['Action',a=>e(a.a)]],S.audit.slice(0,60)),1)}
${card('Login history',tbl([['Time',a=>fmt(a.t)],['User',a=>e(a.u)]],S.logins.slice(0,30)),1)}</div>`}
function usr(i,k,v){S.users.find(x=>x.id===i)[k]=v;log('User '+k+' → '+v);save();render()}
function perm(r,t,on){const a=S.roles[r];if(on&&!a.includes(t))a.push(t);if(!on)S.roles[r]=a.filter(x=>x!==t);log(`Perm ${r}/${t} ${on}`);save()}
const RK={DPS:['Colonel','Lieutenant Colonel','Chief','Assistant Chief','Major','Captain','Lieutenant','Staff Sergeant','Sergeant','Master Trooper','Trooper First Class','Trooper Second Class','Cadet'],HCSO:['Deputy','Corporal','Sergeant','Lieutenant','Captain','Major'],HPD:['Officer','Senior Officer','Sergeant','Lieutenant','Captain','Assistant Chief'],HFD:['Firefighter','Engineer','Paramedic','Lieutenant','Captain','District Chief']},SUPR=['Colonel','Lieutenant Colonel','Chief','Assistant Chief','Major','Captain','Lieutenant','Staff Sergeant','Sergeant','District Chief','Supervisor'],CMDR=['Colonel','Lieutenant Colonel','Chief','Assistant Chief','Major','Captain','Lieutenant','District Chief'];
const stc=s=>`<span class="tag" style="background:${{'10-8':'#2e7d32','10-6':'#c77d00','10-7':'#607d8b','10-23':'#1f5fbf','10-76':'#7b3fbf','10-99':'#c62828'}[s.split(' ')[0]]||'#37474f'}">${s.split(' ')[0]}</span> `;
function cc(){const t=CC.t,T=['Civilian','Police','Fire Dept','911 Dispatch','CAD Admin'];let b='';
if(t==='Civilian')b=form('k1',[['name','Full name','text','r'],['dob','Date of birth','date'],['dls','Driver license',['Valid','Expired','Suspended','None']],['addr','Home address','text'],['plate','Vehicle plate','text'],['veh','Vehicle (year/make/model)','text'],['color','Vehicle color','text']],'Create civilian',v=>mkChar(t,v));
if(t==='Police')b=`<label>Department<select onchange="CC.d=this.value;render()">${['DPS','HCSO','HPD'].map(x=>`<option value="${x}"${CC.d===x?' selected':''}>${e(S.depts.find(d=>d.id===x).name)}</option>`).join('')}</select></label>`+form('k2',[['name','Character name','text','r'],['rank','Rank',RK[CC.d]],['num','Unit number (optional)','text']],'Create officer',v=>mkChar(t,v));
if(t==='Fire Dept')b=form('k3',[['name','Character name','text','r'],['rank','Rank',RK.HFD],['num','Unit number (optional)','text']],'Create firefighter / medic',v=>mkChar(t,v));
if(t==='911 Dispatch')b=form('k4',[['name','Character name','text','r'],['rank','Position',['Call Taker','Dispatcher','Supervisor']]],'Create 911 staff',v=>mkChar(t,v));
if(t==='CAD Admin')b=form('k5',[['name','Administrator name','text','r']],'Create administrator',v=>mkChar(t,v));
return`<div class="login card"><h3>Create character</h3><div class="bar">${T.map(x=>`<button class="${t===x?'on':''}" onclick="CC.t='${x}';render()">${x}</button>`).join('')}</div>${b||'<p class="mu">Choose a character type.</p>'}<p><button onclick="CC.mode='list';CC.t=null;render()">← Back</button></p></div>`}
function mkChar(t,v){const nm=v.name.trim(),id=id_('x'),rk=v.rank,n=Math.floor(Math.random()*800+100);let us={id,name:nm,rank:rk,sh:'off',uid:null};
if(t==='Civilian'){Object.assign(us,{role:'Civilian',dept:'CIV',rank:'Civilian'});S.people.push({name:nm,dob:v.dob,dl:'TX '+(10000000+Math.floor(Math.random()*8e7)),dls:v.dls,addr:v.addr});if(v.plate)S.vehs.push({plate:v.plate.toUpperCase(),desc:v.veh,color:v.color,owner:nm,reg:'Valid',exp:'2027-06-01',stolen:false})}
else{const d=t==='Police'?CC.d:t==='Fire Dept'?'HFD':'H911';us.dept=d;us.role=t==='CAD Admin'?'Admin':SUPR.includes(rk)?'Supervisor':t==='911 Dispatch'?'Dispatcher':'Officer';
if(t==='Police'||t==='Fire Dept'){const dp=S.depts.find(x=>x.id===d),un={id:id_('u'),name:nm,callsign:dp.prefix+'-'+(v.num||n),badge:String(1000+n),rank:rk,dept:d,status:ST[6],vehicle:(t==='Fire Dept'?'Apparatus ':'Patrol unit ')+(v.num||n),loc:'—',sup:'—'};S.units.push(un);us.uid=un.id}}
S.users.push(us);S.meId=id;CC.mode='list';CC.t=null;S.logins.unshift({t:iso(),u:nm,a:'Login'});log('Character created: '+nm)}
function civ(){const m=me(),p=S.people.find(x=>x.name===m.name)||{},vs=S.vehs.filter(v=>v.owner===m.name);
return`<div class="grid">${card('Identity',`<p><b>${e(m.name)}</b><br>DOB ${e(p.dob)}<br>DL ${e(p.dl)} – <b>${e(p.dls)}</b><br>${e(p.addr)}</p>`)}${card('Vehicles',tbl([['Plate',v=>e(v.plate)],['Vehicle',v=>e(v.color+' '+v.desc)],['Registration',v=>e(v.reg)]],vs))}${card('Call 911',form('c911',[['type','Emergency type',S.set.types],['loc','Your location','text','r'],['notes','What is happening?','ta']],'📞 Call 911',v=>{S.calls.push({id:id_('C'),t:iso(),type:v.type,pri:2,name:m.name,phone:'',loc:v.loc,dept:'H911',notes:[v.notes],disp:'',units:[],status:'Pending',closed:null});log('911 call from civilian');toast('911 call placed – dispatch notified')}))}${card('My record',`Citations: ${S.cites.filter(c=>c.name===m.name).length} · Arrests: ${S.arrests.filter(c=>c.name===m.name).length} · Active warrants: ${S.warrants.filter(w=>w.name===m.name&&w.status==='Active').length}`)}</div>`}
let MSEL=null;
const gl=(x,y)=>String.fromCharCode(65+Math.min(9,Math.floor(x/100)))+(Math.floor(y/100)+1);
function mapClick(ev){S.pos=S.pos||{};if(!MSEL)return toast('Select a unit or call first');const r=ev.currentTarget.getBoundingClientRect(),x=Math.round((ev.clientX-r.left)/r.width*1000),y=Math.round((ev.clientY-r.top)/r.height*1000),c=S.calls.find(k=>k.id===MSEL);
if(c){c.mx=x;c.my=y;log('Pinned call '+c.id+' at '+gl(x,y))}else{S.pos[MSEL]={x,y};const u=unit(MSEL);if(u)u.loc='Grid '+gl(x,y);log('Located '+(u?u.callsign:MSEL)+' at '+gl(x,y))}save();render()}
function mapDel(){S.pos=S.pos||{};const c=S.calls.find(k=>k.id===MSEL);if(c){c.mx=null;c.my=null}else delete S.pos[MSEL];save();render()}
function mapImg(i){const f=i.files[0];if(!f)return;if(f.size>4e6)return toast('Image too large (max ~4 MB) – export at Medium quality');const r=new FileReader();r.onload=()=>{S.mapbg=r.result;save();render()};r.readAsDataURL(f)}
let MV={x:0,y:0,w:1000,h:1000},ML={g:1},DR=null,SIDE=true;
const spt=(ev,s)=>{const p=s.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(s.getScreenCTM().inverse())};
function setPos(id,x,y){x=Math.max(0,Math.min(1000,Math.round(x)));y=Math.max(0,Math.min(1000,Math.round(y)));S.pos=S.pos||{};const c=S.calls.find(k=>k.id===id);if(c){c.mx=x;c.my=y;log('Pinned call '+id+' at '+gl(x,y))}else{S.pos[id]={x,y};const u=unit(id);if(u)u.loc='Grid '+gl(x,y);log('Moved '+(u?u.callsign:id)+' to '+gl(x,y))}save()}
function mapZoom(f){const nw=Math.max(80,Math.min(1000,MV.w*f)),cx=MV.x+MV.w/2,cy=MV.y+MV.h/2;MV={x:Math.max(0,Math.min(1000-nw,cx-nw/2)),y:Math.max(0,Math.min(1000-nw,cy-nw/2)),w:nw,h:nw};render()}
function mapWheel(ev){ev.preventDefault();const p=spt(ev,ev.currentTarget),nw=Math.max(80,Math.min(1000,MV.w*(ev.deltaY<0?.85:1.18))),r=nw/MV.w;MV={x:Math.max(0,Math.min(1000-nw,p.x-(p.x-MV.x)*r)),y:Math.max(0,Math.min(1000-nw,p.y-(p.y-MV.y)*r)),w:nw,h:nw};render()}
function mapDown(ev){const s=ev.currentTarget,g=ev.target.closest('[data-id]');DR=g?{m:1,id:g.dataset.id,g,mv:0,p0:spt(ev,s)}:{m:0,sx:ev.clientX,sy:ev.clientY,vx:MV.x,vy:MV.y,mv:0};s.setPointerCapture(ev.pointerId)}
function mapMove(ev){if(!DR)return;const s=ev.currentTarget;if(DR.m){const p=spt(ev,s);if(Math.hypot(p.x-DR.p0.x,p.y-DR.p0.y)>4*MV.w/1000)DR.mv=1;if(DR.mv)DR.g.setAttribute('transform',`translate(${p.x-DR.p0.x} ${p.y-DR.p0.y})`)}else{const r=s.getBoundingClientRect(),dx=ev.clientX-DR.sx,dy=ev.clientY-DR.sy;if(Math.hypot(dx,dy)>4)DR.mv=1;if(DR.mv){MV.x=Math.max(0,Math.min(1000-MV.w,DR.vx-dx*MV.w/r.width));MV.y=Math.max(0,Math.min(1000-MV.h,DR.vy-dy*MV.h/r.height));s.setAttribute('viewBox',`${MV.x} ${MV.y} ${MV.w} ${MV.h}`)}}}
function mapUp(ev){if(!DR)return;const d=DR,p=spt(ev,ev.currentTarget);DR=null;
if(d.m){MSEL=d.id;if(d.mv){const c=S.calls.find(k=>k.id===d.id),o=c?{x:c.mx,y:c.my}:S.pos[d.id];setPos(d.id,o.x+p.x-d.p0.x,o.y+p.y-d.p0.y)}render()}
else if(!d.mv){if(!MSEL)return toast('Select a marker first, then click the map to place it');setPos(MSEL,p.x,p.y);render()}}
function map(side){S.pos=S.pos||{};if(!MSEL&&myU())MSEL=myU().id;
const col=s=>({'10-8':'#2e9e4f','10-6':'#e0a000','10-7':'#7a8b99','10-23':'#2f81f7','10-76':'#a56bff','10-99':'#ff3b30'}[s.split(' ')[0]]||'#9aa'),pc={1:'#ff3b30',2:'#ff9500',3:'#34c759',4:'#8e9aa6'};
const ents=[...S.units.map(u=>({id:u.id,l:u.callsign,c:col(u.status),s:u.status})),...S.users.filter(u=>u.role==='Civilian').map(u=>({id:u.id,l:u.name,c:'#e6e6e6',s:'Civilian'}))].filter(x=>S.pos[x.id]);
const k=MV.w/1000;const cl=S.calls.filter(c=>c.status!=='Closed'&&c.mx!=null);
const opts=[...S.calls.filter(c=>c.status!=='Closed').map(c=>[c.id,'CALL '+c.id+' – '+c.type]),...S.units.map(u=>[u.id,u.callsign+' – '+u.name]),...S.users.filter(u=>u.role==='Civilian').map(u=>[u.id,'Civilian – '+u.name])];
const grid=[...Array(11).keys()].map(i=>`<line x1="${i*100}" y1="0" x2="${i*100}" y2="1000"/><line x1="0" y1="${i*100}" x2="1000" y2="${i*100}"/>`).join(''),lab=[...Array(10).keys()].map(i=>`<text x="${i*100+46}" y="14">${String.fromCharCode(65+i)}</text><text x="4" y="${i*100+54}">${i+1}</text>`).join('');
const svg=`<svg viewBox="${MV.x} ${MV.y} ${MV.w} ${MV.h}" class="mapsvg" onwheel="mapWheel(event)" onpointerdown="mapDown(event)" onpointermove="mapMove(event)" onpointerup="mapUp(event)"><rect width="1000" height="1000" fill="#0a121b"/><image href="${S.mapbg||MAPIMG}" width="1000" height="1000" preserveAspectRatio="xMidYMid slice"/>${ML.g?`<g stroke="rgba(120,160,200,.3)" stroke-width="${k}" fill="none">${grid}</g><g fill="#9fb3c8" font-size="${13*k}" font-family="monospace">${lab}</g>`:''}${cl.map(c=>`<g data-id="${c.id}" style="cursor:grab"><g transform="translate(${c.mx} ${c.my}) scale(${k}) translate(${-c.mx} ${-c.my})"><polygon points="${c.mx},${c.my-15} ${c.mx+13},${c.my+10} ${c.mx-13},${c.my+10}" fill="${pc[c.pri]}" stroke="${MSEL===c.id?'#ffe600':'#fff'}" stroke-width="2"/><text x="${c.mx+16}" y="${c.my+4}" fill="#fff" font-size="13" font-family="monospace" stroke="#000" stroke-width="3" style="paint-order:stroke">${c.id} P${c.pri}</text></g></g>`).join('')}${ents.map(x=>{const p=S.pos[x.id];return`<g data-id="${x.id}" style="cursor:grab"><g transform="translate(${p.x} ${p.y}) scale(${k}) translate(${-p.x} ${-p.y})"><circle cx="${p.x}" cy="${p.y}" r="9" fill="${x.c}" stroke="${MSEL===x.id?'#ffe600':'#fff'}" stroke-width="2.5"/><text x="${p.x+13}" y="${p.y+4}" fill="#fff" font-size="13" font-family="monospace" stroke="#000" stroke-width="3" style="paint-order:stroke">${e(x.l)}</text></g></g>`}).join('')}</svg>`;
const mc=w=>card('Live map – drag to pan · scroll or buttons to zoom · drag markers to move them',`<div class="bar"><select onchange="MSEL=this.value;render()"><option value="">Select marker…</option>${opts.map(o=>`<option value="${o[0]}"${o[0]===MSEL?' selected':''}>${e(o[1])}</option>`).join('')}</select><button onclick="mapDel()">Remove marker</button><button onclick="mapZoom(.7)">＋ Zoom in</button><button onclick="mapZoom(1.4)">－ Zoom out</button><button onclick="MV={x:0,y:0,w:1000,h:1000};render()">Reset view</button><label style="display:flex;flex-direction:row;gap:4px;align-items:center"><input type="checkbox" style="width:auto"${ML.g?' checked':''} onchange="ML.g=this.checked;render()"> Grid</label></div>${svg}`,w);
if(side)return mc(0);
return`<div class="grid">${SIDE?'<p class="mu" style="grid-column:1/-1">The map is docked on the right. Use “Hide map panel” above to show it full size here.</p>':mc(1)}${card('Players on map',tbl([['Unit / Player',x=>e(x.l)],['Status',x=>e(x.s)],['Grid',x=>gl(S.pos[x.id].x,S.pos[x.id].y)]],ents))}${card('Map image',`<p class="mu">Open <a href="https://erlc.one/" target="_blank" rel="noopener" style="color:var(--ac)">ERLC.One</a>, use <b>Export</b> to save a newer image, then upload it here to replace the built-in map.</p><input type="file" accept="image/*" onchange="mapImg(this)">${S.mapbg?'<p><button onclick="S.mapbg=\'\';save();render()">Remove background</button></p>':''}`)}</div>`}
const V={calls,units,depts,stop,records,reports,fireems,sup,comms,admin,civ,map};
function render(){const app=document.getElementById('app'),m=me();
if(!m&&CC.mode!=='list'){app.innerHTML=cc();return}
if(!m){app.innerHTML=`<div class="login card"><h3>${e(S.set.agency)} – Sign in</h3><p class="mu">Select a character, or create a new one. Saved in this browser only.</p><p><button class="pri" onclick="CC.mode='create';render()">＋ Create new character</button></p><div class="form">${S.users.length?'':'<p class="mu">No characters yet.</p>'}${S.users.map(u=>`<button onclick="login('${u.id}')">${e(u.name)} – ${e(u.rank||u.role)} · ${u.dept==='CIV'?'Civilian':u.dept}</button>`).join('')}</div></div>`;return}
if(!can(S.tab))S.tab=TABS.find(t=>can(t[0]))[0];
const sh=m.sh,badge={off:'Off shift',on:'On shift',break:'On break'}[sh];
const al=S.alerts.filter(a=>a.on).slice(0,4).map(a=>`<div class="alert ${a.lvl>1?'i':''}"><b>${a.lvl>1?'ALERT':'EMERGENCY'}</b><span>${e(a.text)} <small>${fmt(a.t)}</small></span><span class="sp"></span><button onclick="clearA('${a.id}')">Dismiss</button></div>`).join('');
app.innerHTML=`<header><b class="brand">${e(S.set.agency)}</b><span class="mu">CAD TERM-01</span><span id="clk" class="clk"></span><span class="mu">${e(m.name)} · ${e(m.rank||m.role)} · ${m.dept==='CIV'?'Civilian':m.dept}${myU()?' · '+e(myU().callsign):''} · <b class="pill ${m.role==='Civilian'?'on':sh}">${m.role==='Civilian'?'Civilian':badge}</b>${m.start&&sh!=='off'?' since '+fmt(m.start):''}</span><span class="sp"></span>${m.role==='Civilian'?'':sh==='off'?'<button class="pri" onclick="shift(\'start\')">Start shift</button>':sh==='on'?'<button onclick="shift(\'break\')">Take break</button><button onclick="shift(\'end\')">End shift</button>':'<button class="pri" onclick="shift(\'resume\')">End break</button><button onclick="shift(\'end\')">End shift</button>'}${sh!=='off'&&myU()?'<button class="red" onclick="if(confirm(\'Send panic alert?\'))panic()">PANIC</button>':''}<button onclick="logout()">Sign out</button></header>${al}${strip()}<div class="shell"><nav>${TABS.filter(t=>can(t[0])).map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="S.tab='${t[0]}';render()"><i>${t[0].slice(0,2).toUpperCase()}</i>${t[1]}</button>`).join('')}${can('map')?`<button class="sidebtn" onclick="SIDE=!SIDE;render()">${SIDE?'Hide map panel':'Dock map right'}</button>`:''}</nav><div class="lay${SIDE&&can('map')?'':' one'}"><main>${V[S.tab]()}</main>${SIDE&&can('map')?`<aside class="side">${map(1)}</aside>`:''}</div></div><footer class="foot"><span>USER: ${e(m.name)}</span><span>${m.dept==='CIV'?'CIVILIAN':m.dept}</span><span>${myU()?e(myU().callsign)+' · '+e(myU().status):'NO UNIT'}</span><span class="sp"></span><span>OPEN CALLS: ${S.calls.filter(c=>c.status!=='Closed').length}</span><span>UNITS: ${S.units.filter(u=>u.status!==ST[6]).length}</span><span>DB: LOCAL</span></footer>`}
function clearA(i){S.alerts.find(a=>a.id===i).on=false;save();render()}
setInterval(()=>{const c=document.getElementById('clk');if(c)c.textContent=new Date().toLocaleString([], {dateStyle:'medium',timeStyle:'medium'})},1000);
render();
</script></body></html>
